stages:
  - lint
  - test
  - deploy

variables:
  PYTHON_VERSION: "{{ cookiecutter.python_version }}"
  POSTGRES_DB: test_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust

default:
  image: python:{{ cookiecutter.python_version }}
  cache:
    paths:
      - .cache/pip
      - venv/

linting:
  stage: lint
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
  only:
    - main
    - merge_requests

testing:
  stage: test
  {%- if cookiecutter.database == "postgresql" %}
  services:
    - postgres:16
  {%- endif %}
  variables:
    {%- if cookiecutter.database == "postgresql" %}
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/test_db"
    {%- else %}
    DATABASE_URL: "sqlite:///data/test_db.sqlite3"
    {%- endif %}
    SECRET_KEY: "gitlab_ci_dummy_secret_key_12345"
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[test]"
    - pip install -e "."
    - cp .env.example .env.test
    - cp .env.test .env
    - pytest
  only:
    - main
    - merge_requests

{%- if cookiecutter.deploy_to_vps == "yes" %}
deploy_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh ubuntu@$VPS_IP << 'EOF'
        set -e
        echo "Starting deployment on VPS..."
        mkdir -p /home/ubuntu/{{ cookiecutter.project_slug }}
        cd /home/ubuntu/{{ cookiecutter.project_slug }}
        
        if [ ! -d ".git" ]; then
          git init
          git remote add origin $CI_REPOSITORY_URL || true
        else
          git remote set-url origin $CI_REPOSITORY_URL
        fi
        
        git fetch origin main
        git reset --hard origin/main
        
        {%- if cookiecutter.use_docker == "yes" %}
        docker system prune -f
        docker compose up -d --build
        docker compose exec -T web python manage.py migrate
        docker compose exec -T web python manage.py collectstatic --noinput
        {%- if cookiecutter.use_huey == "yes" %}
        docker compose restart huey
        {%- endif %}
        {%- endif %}
        
        echo "Deployment complete!"
      EOF
  only:
    - main
  environment:
    name: production
{%- endif %}
